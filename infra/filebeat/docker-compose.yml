services:
  filebeat:
    image: docker.elastic.co/beats/filebeat:${ELASTIC_VERSION}
    container_name: runiverse-filebeat
    network_mode: host            # 컨테이너가 WSL의 localhost:19200(터널)을 보게 함
    command: ["filebeat", "-e", "--strict.perms=false"]
    environment:
      ES_HOST: https://localhost:19200
      ES_USERNAME: ${ES_USERNAME}
      ES_PASSWORD: ${ES_PASSWORD}
    volumes:
      - ./filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - ./http_ca.crt:/usr/share/filebeat/certs/http_ca.crt:ro
      - ../../running-service/logs:/logs:ro
      - filebeat-data:/usr/share/filebeat/data   # 어디까지 읽었는지 기록 (재시작해도 이어서)

volumes:
  filebeat-data:
