# 환경변수 위치 설정
# 실행 주체 모두 running-service/를 작업 디렉터리로 쓴다 -> 첫 번째
# 두 번째는 저장소 루트에서 실행하는 경우를 위한 대비
spring.config.import=optional:file:./.env[.properties],optional:file:./running-service/.env[.properties]

# 애플리케이션 이름
spring.application.name=running-service

# CORS 설정
cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
cors.allowed-methods=${CORS_ALLOWED_METHODS}
cors.allowed-headers=${CORS_ALLOWED_HEADERS}

# HTTP 클라이언트 타임아웃 설정
spring.http.client.connect-timeout=2s
spring.http.client.read-timeout=3s

# 매칭 SSE
# 무한(0)으로 두지 않는다 — FIN 없이 사라진 단말의 연결이 영원히 남는다.
# 이벤트가 전부 전체 상태라 재연결 비용은 스냅샷 한 번뿐이다
match-stream.timeout=30m
# ALB 유휴 타임아웃(기본 60초)보다 충분히 짧아야 한다.
# record가 아니라 MatchStreamKeepAlive의 @Scheduled가 이 키를 직접 읽는다
match-stream.keep-alive-interval=15s

# 매칭 모집
# 모집 마감 시각 = start_at - 이 오프셋 (api-spec 5-A: 19:00 슬롯 → 18:50 마감)
match.close-offset=10m
match.ready-offset=10s
match.force-finish-offset=6h
# 페이스 차이가 이 값 이내면 동급으로 보고 leave_count로 후보 순위를 가른다.
# 페이스로 후보 자격을 거르지는 않는다 — 페이스는 후보 순서만 정하고, 이건 그 순서의 동점 처리다
match.pace-tie-tolerance-seconds-per-km=10
match.cooldown=20m

# 솔로 러닝
# 강제 종료 시각 = start_at + 이 값. running-track.ttl보다 짧아야 남은 좌표로 기록을 낸다
solo.force-finish-offset=6h

# WEBSOCKET 관련 설정
websocket.idle-timeout=2m
websocket.max-text-message-buffer-size=64KB
websocket.running-endpoint=ws/running
# 한 연결에 쓰는 스레드가 여럿이라 전송을 줄 세운다 — 한도를 넘기면 연결을 닫아 재연결로 복구시킨다
running-websocket.send-time-limit=10s
running-websocket.send-buffer-size-limit=512KB

# 루트 API URL 설정
server.servlet.context-path=/api/v1

# 러닝 콤보 — 함께 뛰는 구간 판정
running-combo.enter-meters=30
running-combo.exit-meters=30
running-combo.freshness=19s
running-combo.tick=10s
running-combo.miss-allowance=1

# 러닝 종료 판정 설정
# 확정 거리가 목표의 이 비율 미만이면 조기 종료 제재
running-finish.penalty-distance-ratio=0.8
# 구간 거리(미터) — 러닝 종료 응답의 splitDistanceMeters로 그대로 제공
running-finish.split-distance-meters=10
# 둘 중 하나라도 최솟값 미만인 러닝은 기록 없이 상태만 확정
running-finish.min-distance-meters=100
running-finish.min-duration-seconds=60
# GPS 고도는 수 m씩 튀어서 이 값보다 작은 변화는 노이즈로 무시 — 안 거르면 평지에서도 상승고도 누적
running-finish.elevation-noise-threshold-meters=3.0
running-finish.cooldown=20m

# 날씨 설정
# 조회 실패·값 없음 시 들어가는 폴백
# 없던 악조건을 만들지 않도록 맑음·평상 기온으로 설정
weather.default-code=0
weather.default-temperature=15.0
# 키 없는 무료 API(Open-Meteo)라 시크릿 없음
weather.base-uri=https://api.open-meteo.com
# timeout은 연결·읽기에 각각 적용되며, 재시도한 만큼 러닝 종료 응답이 늦어진다
weather.timeout=1s
weather.max-attempts=3

# 데이터베이스 설정
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

# Redis 설정
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}
spring.data.redis.password=${REDIS_PASSWORD}
# 러닝 관련
# 정리되지 못한 러닝 좌표의 영구 잔류 방지 — 최장 러닝 + 여유
running-track.ttl=7h

# JPA 설정
spring.jpa.hibernate.ddl-auto=${JPA_DDL}
spring.jpa.show-sql=${JPA_SHOW_SQL}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL}
spring.jpa.open-in-view=${JPA_OPEN_IN_VIEW}
# 러닝 종료 시 구간이 방당 수천 행이라 묶어서 전송
spring.jpa.properties.hibernate.jdbc.batch_size=100
spring.jpa.properties.hibernate.order_inserts=true
# 묶은 INSERT를 PostgreSQL 드라이버가 multi-value 문장으로 재작성
spring.datasource.hikari.data-source-properties.reWriteBatchedInserts=true

# 타임존 설정 (앱 전역 — JVM 기본값은 TimeZoneConfig가 적용)
app.time-zone=${APP_TIME_ZONE}

# JWT 설정
jwt.issuer=runiverse
jwt.audience=runiverse-api
jwt.access-token.secret=${JWT_ACCESS_SECRET}
jwt.access-token.ttl=${JWT_ACCESS_TTL}
jwt.refresh-token.secret=${JWT_REFRESH_SECRET}
jwt.refresh-token.ttl=${JWT_REFRESH_TTL}

# Kakao OAuth 설정
oauth.kakao.client-id=${KAKAO_REST_API_KEY}
oauth.kakao.client-secret=${KAKAO_CLIENT_SECRET}
oauth.kakao.redirect-uri=${KAKAO_REDIRECT_URI}
oauth.kakao.unlink-admin-key=${KAKAO_UNLINK_ADMIN_KEY}
oauth.kakao.token-uri=https://kauth.kakao.com/oauth/token
oauth.kakao.user-info-uri=https://kapi.kakao.com/v2/user/me
oauth.kakao.unlink-uri=https://kapi.kakao.com/v1/user/unlink

# Google OAuth 설정 — 앱이 보낸 ID 토큰을 구글 공개키로 검증한다
oauth.google.client-id=${GOOGLE_CLIENT_ID}
oauth.google.jwk-set-uri=https://www.googleapis.com/oauth2/v3/certs

# AWS SES 설정
mail.ses.region=${SES_REGION}
mail.ses.from=${SES_FROM_ADDRESS}
mail.ses.from-name=${SES_FROM_NAME}
email-verification.code-ttl=5m
email-verification.cooldown=30s
email-verification.ticket-ttl=30m
email-verification.max-attempts=5
email-verification.daily-limit=10
# 로컬 테스트 전용 -> :는 앞의 값이 없다면 기본값 설정
mail.ses.access-key-id=${SES_TEST_ACCESS_KEY_ID:}
mail.ses.secret-access-key=${SES_TEST_SECRET_ACCESS_KEY:}

# AWS S3 설정
storage.s3.region=${S3_REGION}
storage.s3.user-asset-bucket=${S3_USER_ASSET_BUCKET}
storage.s3.gps-track-bucket=${S3_GPS_TRACK_BUCKET}
storage.s3.presigned-url-ttl=10m
storage.s3.view-url-ttl=1h
# 로컬 테스트 전용 -> :는 앞의 값이 없다면 기본값 설정
storage.s3.access-key-id=${S3_ACCESS_KEY_ID:}
storage.s3.secret-access-key=${S3_SECRET_ACCESS_KEY:}

# 스케줄러 기본 풀은 1스레드다 — keep-alive가 느린 단말에서 블로킹되면 뒤 연결의 ping이 밀린다
spring.task.scheduling.pool.size=4

# 회원탈퇴 설정
# 탈퇴 기록 보관 기간 — 지나면 이메일·닉네임과 프로필 사진을 지운다
account-deletion.retention=90d
# 위 정리가 도는 시각 — 매일 오전 6시. 강제 종료가 몰리는 새벽은 피한다
account-deletion.redaction-cron=0 0 6 * * *

# 로그 파일 설정
# - 파일은 ECS JSON(ELK 수집용), 콘솔은 텍스트
# - APP_TIME_ZONE 자정마다 새 파일, 지난 파일은 gzip 압축 후 2일 보관
# - 크기 한도는 하루 한 파일을 유지하기 위한 안전장치, 전체 상한은 디스크 보호용
logging.file.name=${LOG_DIR}/running-service.log
logging.structured.format.file=ecs
logging.logback.rollingpolicy.file-name-pattern=${LOG_DIR}/running-service.%d{yyyy-MM-dd,${APP_TIME_ZONE}}.%i.log.gz
logging.logback.rollingpolicy.max-file-size=1GB
logging.logback.rollingpolicy.max-history=2
logging.logback.rollingpolicy.total-size-cap=3GB
logging.logback.rollingpolicy.clean-history-on-start=true
# 콘솔에 요청 ID 앞 8자리 표시 (파일에는 전체 저장)
logging.pattern.correlation=[%.-8X{requestId:-}] [%.8X{userId:--}]\u0020

# 메트릭 — health 외에는 prometheus만 연다
management.endpoints.web.exposure.include=health,prometheus
management.metrics.tags.application=${spring.application.name}
# p95·p99를 Grafana에서 계산하려면 버킷이 필요하다
management.metrics.distribution.percentiles-histogram.http.server.requests=true
